[project]
name = "ecommerce-video-generation"
version = "0.1.0"
description = "Local reference-to-product-video proof of concept"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.optional-dependencies]
auto-mask = ["torch>=2.5", "torchvision>=0.20", "transformers>=4.57,<5", "pillow>=10", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ecom-video = "ecom_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_video"]
